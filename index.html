<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fish Triton — GWC Newsletter Insert</title>
</head>
<body style="margin:0; padding:0; background-color:#E1E4E9; font-family:Arial, Helvetica, sans-serif;">

<!-- This entire block is designed to be inserted as one section inside the GWC newsletter,
     matching their existing table width (520-550px) and divider style. -->

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#E1E4E9;">
<tr>
<td align="center" style="padding:20px 12px;">

<table role="presentation" width="520" cellpadding="0" cellspacing="0" style="max-width:520px; width:100%;">

  <!-- Top divider, matches GWC's section style -->
  <tr>
    <td style="border-top:3px solid #618BE1; font-size:0; line-height:0;">&nbsp;</td>
  </tr>

  <!-- Section label, matches GWC's grey section headers -->
  <tr>
    <td style="padding:15px 0 9px;">
      <p style="margin:0; font-family:Tahoma, sans-serif; font-weight:bold; font-size:11px; letter-spacing:0.03em; color:#7F8C8D; text-transform:uppercase;">Member Perk</p>
    </td>
  </tr>

  <!-- The clickable banner -->
  <tr>
    <td>
      <a href="https://fishtriton.com/" style="text-decoration:none; display:block;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0b1d33; border-radius:4px; overflow:hidden;">

          <!-- Hero image -->
          <tr>
            <td>
              <img src="https://fishtriton.com/wp-content/uploads/2026/08/image003-1-1.jpg" width="520" height="400" style="display:block; width:100%; max-width:520px; height:300px; object-fit:cover; object-position:center;" alt="Fish Triton Palm Beach fishing charter">
            </td>
          </tr>

          <!-- Text content -->
          <tr>
            <td align="center" style="padding:22px 24px 26px;">
              <img src="https://fishtriton.com/wp-content/uploads/2026/04/7953-Fish-Triton-final-logo-files_1-FINAL.png" width="70" style="display:block; margin:0 auto 12px;" alt="Fish Triton">
              <p style="margin:0 0 6px; font-family:Georgia, 'Times New Roman', serif; font-size:20px; color:#ffffff; line-height:1.3;">Wintering in Palm Beach?</p>
              <p style="margin:0 0 16px; font-size:13.5px; color:#c3d3e3; line-height:1.6; max-width:400px;">
                Fish Triton offers premium private charters aboard a 55' Viking sportfishing yacht — the perfect outing for family visits, client entertaining, or an unforgettable day on the Gulf Stream this season.
              </p>
              <span style="display:inline-block; background-color:#1f7ac9; color:#ffffff; font-size:13px; font-weight:bold; padding:11px 26px; border-radius:4px;">BOOK YOUR CHARTER</span>
            </td>
          </tr>

        </table>
      </a>
    </td>
  </tr>

</table>

</td>
</tr>
</table>
